<section class="orbital-chart" role="region" aria-label="Carta orbital con rutas a las secciones del portafolio">
  <header class="chart-heading">
    <div>
      <p class="chart-eyebrow">CARTA ORBITAL · SECTOR LOCAL</p>
      <h3>Red de estaciones</h3>
    </div>
    <span class="chart-reference">FB / NAV-01</span>
  </header>

  <div class="chart-canvas">
    <div class="chart-stars" aria-hidden="true"></div>
    <div class="orbital-plane plane-one" aria-hidden="true"></div>
    <div class="orbital-plane plane-two" aria-hidden="true"></div>
    <div class="orbital-plane plane-three" aria-hidden="true"></div>
    @for (st of stations; track st.id) {
      <button
        type="button"
        class="orbital-station"
        [style.left.%]="st.baseX"
        [style.top.%]="st.baseY"
        [class.is-hovered]="hoveredStation()?.id === st.id"
        (mouseenter)="onStationHover(st)"
        (mouseleave)="onStationHover(null)"
        (focus)="onStationHover(st)"
        (blur)="onStationHover(null)"
        (click)="onStationClick(st)"
        [attr.aria-label]="st.name + ' · ' + st.category + '. Abrir sección.'">
        <span class="station-silhouette" aria-hidden="true"><span class="station-body"></span><span class="solar-wing wing-left"></span><span class="solar-wing wing-right"></span><span class="station-signal"></span></span>
        <span class="station-label-block">
          <span class="station-code-tag">{{ st.code }}</span>
          <strong class="station-name">{{ st.name }}</strong>
          <span class="station-category">{{ st.category }}</span>
        </span>
        <span class="station-open-mark" aria-hidden="true">↗</span>
      </button>
    }
  </div>

  <footer class="chart-footer">
    <span><i aria-hidden="true"></i> 05 BALIZAS DE DATOS</span>
    <span>Seleccioná una estación para abrir su registro</span>
  </footer>
</section>
