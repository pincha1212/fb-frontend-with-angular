<div #parallaxContainer class="parallax-space-wrapper" role="region" aria-label="Mapa Parallax de Estaciones Espaciales">
  <!-- LAYER 0: Deep Space Nebula & Constellation Grid (Far Parallax Layer) -->
  <div class="parallax-layer layer-far" [style.transform]="getFarParallaxTransform()">
    <div class="nebula-glow nebula-cyan"></div>
    <div class="nebula-glow nebula-purple"></div>
    <div class="nebula-glow nebula-gold"></div>
    <div class="space-grid-pattern"></div>
  </div>

  <!-- LAYER 1: Orbital Connectors & Vector Constellation Lines (Mid Parallax Layer) -->
  <div class="parallax-layer layer-mid" [style.transform]="getMidParallaxTransform()">
    <svg class="orbital-constellation-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
      <defs>
        <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.5" />
          <stop offset="50%" stop-color="#bd00ff" stop-opacity="0.3" />
          <stop offset="100%" stop-color="#00ff88" stop-opacity="0.5" />
        </linearGradient>
      </defs>
      <!-- Orbital hyper-lanes connecting stations -->
      <path d="M 20 28 L 72 22 L 78 70 L 45 55 L 18 72 Z" fill="none" stroke="url(#orbitGrad)" stroke-width="0.35" stroke-dasharray="1 1" />
      <circle cx="50" cy="50" r="38" fill="none" stroke="rgba(56, 189, 248, 0.15)" stroke-width="0.25" />
    </svg>
  </div>

  <!-- LAYER 2: Main Floating Orbital Stations (Interactive Parallax Layer) -->
  <div class="parallax-layer layer-interactive">
    @for (st of stations; track st.id) {
      <div 
        class="floating-station-card"
        [style.left.%]="st.baseX"
        [style.top.%]="st.baseY"
        [style.transform]="getStationTransform(st)"
        [class.is-hovered]="hoveredStation()?.id === st.id"
        (mouseenter)="onStationHover(st)"
        (mouseleave)="onStationHover(null)"
        (click)="onStationClick(st)"
        role="button"
        tabindex="0"
        [attr.aria-label]="st.name + ' - ' + st.category">
        
        <!-- Holo Light Beam Column -->
        <div class="holo-light-pillar" [style.background]="'radial-gradient(ellipse at bottom, ' + st.glowColor + ' 0%, transparent 70%)'"></div>

        <!-- Station Structural Pod -->
        <div class="station-pod" [style.border-color]="st.accentHex" [style.box-shadow]="'0 0 24px ' + st.glowColor">
          <div class="station-beacon-pulse" [style.background-color]="st.accentHex"></div>

          <!-- Station Icon Badge -->
          <div class="station-icon-wrap" [style.border-color]="st.accentHex">
            <span class="station-icon">{{ st.icon }}</span>
          </div>

          <!-- Station Info Labels -->
          <div class="station-label-block">
            <span class="station-code-tag">{{ st.code }}</span>
            <h3 class="station-name" [style.color]="st.accentHex">{{ st.name }}</h3>
            <span class="station-category">{{ st.category }}</span>
          </div>

          <!-- Pulsing Energy Ring -->
          <div class="energy-ring" [style.border-color]="st.accentHex"></div>

          <!-- Interactive Hover Action Badge -->
          <div class="dock-action-badge" [style.background-color]="st.accentHex">
            <span>ACOPLAR E INGRESAR ➜</span>
          </div>
        </div>
      </div>
    }
  </div>

  <!-- LAYER 3: Passing Cosmic Dust & Meteors (Foreground Parallax Layer) -->
  <div class="parallax-layer layer-foreground" [style.transform]="getForegroundParallaxTransform()">
    <div class="floating-debris particle-1"></div>
    <div class="floating-debris particle-2"></div>
    <div class="floating-debris particle-3"></div>
  </div>

  <!-- PROXIMITY ALERT & DOCKING SEQUENCE OVERLAY -->
  @if (hoveredStation(); as hst) {
    <app-docking-alert
      [station]="hst"
      [distanceMeters]="14.8"
      (confirmDock)="onStationClick(hst)"
      (cancelDock)="onStationHover(null)">
    </app-docking-alert>
  }

  <!-- BOTTOM CONTROL BAR & 3D SIMULATOR CTA -->
  <div class="parallax-hud-bottom-bar">
    <div class="hud-status-badge">
      <span class="status-dot"></span>
      <span>MODO ESPACIAL INTEGRADO • EFECTO PARALLAX ACTIVO</span>
    </div>

    <button type="button" class="launch-3d-btn" (click)="onLaunch3D()">
      <span>🚀 Vuelo Libre 3D (Simulador)</span>
    </button>
  </div>
</div>
