<address class="contacto-container" aria-label="Canales de contacto">
  <h2>Contacto</h2>

  <div class="contact-info-pills mb-4">
    <div class="info-pill">
      <span class="pill-icon" aria-hidden="true">LOC</span>
      <span>{{ ubicacion }}</span>
    </div>
    <div class="info-pill">
      <span class="pill-icon" aria-hidden="true">TEL</span>
      <a [href]="'tel:' + telefono" class="phone-link">{{ telefono }}</a>
    </div>
  </div>

  <!-- Redes sociales -->
  <div class="redes-sociales">
    <a href="https://github.com/pincha1212" target="_blank" rel="noopener noreferrer" aria-label="GitHub" class="icon github">
      <img src="assets/icons/github.png" alt="" referrerpolicy="no-referrer">
    </a>
    <a href="https://www.linkedin.com/in/federico-barzola-7138b3216/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn" class="icon linkedin">
      <img src="assets/icons/linkedin.png" alt="" referrerpolicy="no-referrer">
    </a>
  </div>

  <!-- Correo con copiado -->
  <div class="correo-container">
    <div class="input-group">
      <input type="email" class="form-control" [value]="correo" readonly aria-label="Correo electrónico" id="correo">
      <button class="btn btn-outline-secondary" (click)="copiarCorreo()" [class.copiado]="copiado">
        {{ copiado ? 'Copiado' : 'Copiar' }}
      </button>
    </div>
    <!-- Mensaje de estado para copiado -->
    <div *ngIf="mensajeEstado && !mostrarFormulario" class="estado-mensaje" role="status" aria-live="polite" [class.exito]="mensajeExito" [class.error]="!mensajeExito">
      {{ mensajeEstado }}
    </div>
  </div>

  <!-- Botón toggle y formulario con validación básica -->
  <div class="text-center mt-4">
    <button type="button" class="btn btn-primary mb-3" (click)="toggleForm()" [attr.aria-expanded]="mostrarFormulario">
      {{ mostrarFormulario ? 'Cerrar formulario' : 'Escribirme un mensaje' }}
    </button>

    <form *ngIf="mostrarFormulario"
          class="contact-card-form container mt-3 p-4 text-start"
          #contactForm="ngForm"
          (ngSubmit)="enviarFormulario(contactForm)"
          novalidate>

      <div class="mb-3">
          <label for="contact-name" class="form-label font-semibold text-slate-200">Nombre</label>
        <input id="contact-name" type="text" name="name" class="form-control" required minlength="2" #nameInput="ngModel" ngModel autocomplete="name" placeholder="Tu nombre">
        <div *ngIf="nameInput.invalid && (nameInput.dirty || nameInput.touched)" class="validation-error mt-1">
          <small>Revisá el nombre; debe tener al menos 2 caracteres.</small>
        </div>
      </div>

      <div class="mb-3">
        <label for="contact-email" class="form-label font-semibold text-slate-200">Tu correo</label>
        <input id="contact-email" type="email" name="_replyto" class="form-control" required email autocomplete="email" #emailInput="ngModel" ngModel placeholder="nombre@ejemplo.com">
        <div *ngIf="emailInput.invalid && (emailInput.dirty || emailInput.touched)" class="validation-error mt-1">
          <small>Ingresá un correo electrónico válido.</small>
        </div>
      </div>

      <div class="mb-3">
        <label for="contact-message" class="form-label font-semibold text-slate-200">Mensaje</label>
        <textarea id="contact-message" name="message" class="form-control" rows="4" required minlength="10" #msgInput="ngModel" ngModel placeholder="¿En qué puedo ayudarte?"></textarea>
        <div *ngIf="msgInput.invalid && (msgInput.dirty || msgInput.touched)" class="validation-error mt-1">
          <small>El mensaje debe tener al menos 10 caracteres.</small>
        </div>
      </div>

      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mt-4">
        <button type="submit" class="btn btn-success" [disabled]="enviando || contactForm.invalid">
          {{ enviando ? 'Enviando…' : 'Enviar mensaje' }}
        </button>

        <a [href]="'mailto:' + correo + '?subject=Contacto%20Portfolio%20Fede%20Barzola'" class="mailto-link small text-sky-400 text-decoration-none">
          O abrir en tu aplicación de correo
        </a>
      </div>

      <!-- Mensaje de estado dentro del formulario -->
      <div *ngIf="mensajeEstado && mostrarFormulario" class="estado-mensaje mt-3 w-100 text-center" role="status" aria-live="polite" [class.exito]="mensajeExito" [class.error]="!mensajeExito">
        {{ mensajeEstado }}
      </div>
    </form>
  </div>

</address>
