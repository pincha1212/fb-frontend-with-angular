<article class="proyectos-container card-base">
  <h2>Proyectos Destacados</h2>

  <div class="proyectos-grid" appResponsiveLayout>
    <article class="proyecto-card" *ngFor="let proyecto of proyectos" [class.destacado-card]="proyecto.destacado">
      <div class="proyecto-imagen-wrapper">
        <span *ngIf="proyecto.destacado" class="destacado-badge">⭐ Destacado</span>
        <img [src]="proyecto.imagen" [alt]="proyecto.titulo" [title]="proyecto.titulo" referrerpolicy="no-referrer" (error)="handleImageFallback($event, proyecto)" loading="lazy">
      </div>

      <div class="proyecto-info">
        <h3 class="proyecto-titulo">{{ proyecto.titulo }}</h3>
        <span *ngIf="proyecto.subtitulo" class="proyecto-subtitulo">{{ proyecto.subtitulo }}</span>
        <p class="proyecto-desc">{{ proyecto.descripcion }}</p>

        <div class="tecnologias">
          <span *ngFor="let tech of proyecto.tecnologias" [style.background-color]="getTechColor(tech)"
            [style.color]="tech === 'JavaScript' || tech === 'API' ? '#000' : '#fff'">
            {{ tech }}
          </span>
        </div>

        <div class="proyecto-actions">
          <a *ngIf="proyecto.demoUrl" [href]="proyecto.demoUrl" target="_blank" rel="noopener" class="btn-action btn-demo">
            <span>🌐 Ver Demo / Web</span>
          </a>
          <a *ngIf="proyecto.githubUrl" [href]="proyecto.githubUrl" target="_blank" rel="noopener" class="btn-action btn-github">
            <span>💻 GitHub Code</span>
          </a>
        </div>
      </div>
    </article>

    <!-- Tarjeta Especial: Explorar más proyectos -->
    <article class="proyecto-card mas-proyectos-card">
      <div class="mas-proyectos-content">
        <div class="mas-icon-wrapper">
          <span class="mas-icon">📂</span>
        </div>
        <h3>Más Proyectos & Experimentos</h3>
        <p>Explora repositorios adicionales, geovisores y prototipos en GitHub.</p>
        <a href="https://github.com/pincha1212" target="_blank" rel="noopener" class="mas-proyectos-btn">
          <span>Ver Repositorios en GitHub</span>
          <span class="arrow-icon">→</span>
        </a>
      </div>
    </article>
  </div>
</article>
