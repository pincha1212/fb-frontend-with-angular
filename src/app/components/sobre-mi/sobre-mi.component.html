<section class="sobre-mi-container card-base">
  <h2>Sobre Mí</h2>
  
  <div class="sobre-mi-grid">
    <div class="bio-column">
      <p class="bio-text">
        Soy <strong>{{ profile.nombre }}</strong>, {{ profile.titulo }}. {{ profile.resumen }}
      </p>
      <p class="bio-text" *ngIf="profile.bioTexto2">
        {{ profile.bioTexto2 }}
      </p>

      <div class="hitos-row" *ngIf="hitos.length">
        <div *ngFor="let hito of hitos" class="hito-card">
          <span class="hito-number">{{ hito.numero }}</span>
          <span class="hito-label">{{ hito.label }}</span>
        </div>
      </div>

      <div class="competencias-wrapper mt-4" *ngIf="competencias.length">
        <h4 class="competencias-title">Cómo trabajo</h4>
        <div class="competencias-tags">
          <span *ngFor="let comp of competencias" class="comp-tag">✓ {{ comp }}</span>
        </div>
      </div>
    </div>

    <div class="estudios-column">
      <h3>Formación</h3>
      <div class="timeline-container">
        <div *ngFor="let estudio of estudios" class="estudio-item">
          <div class="estudio-dot"></div>
          <div class="estudio-content">
            <span class="estudio-periodo">{{ estudio.periodo }}</span>
            <h4 class="estudio-titulo">{{ estudio.titulo }}</h4>
            <span class="estudio-institucion">{{ estudio.institucion }}</span>
            <p class="estudio-desc">{{ estudio.descripcion }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
