<section class="habilidades-container card-base" aria-label="Tecnologías y herramientas">
  <p class="skills-intro">Herramientas y tecnologías utilizadas en los proyectos del portafolio.</p>

  <div class="skills-catalog">
    <section class="skill-group" *ngFor="let cat of habilidadesData">
      <h3 class="categoria-titulo">{{ cat.categoria }}</h3>
      <ul class="skill-list">
        <li class="skill-row" *ngFor="let item of cat.items">
          <span class="skill-monogram" aria-hidden="true">{{ item.substring(0, 2).toUpperCase() }}</span>
          <span class="skill-name">{{ item }}</span>
        </li>
      </ul>
    </section>
  </div>
</section>
