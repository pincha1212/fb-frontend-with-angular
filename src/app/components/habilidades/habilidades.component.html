<section class="habilidades-container card-base" aria-label="Tecnologías y herramientas">
  <p class="skills-intro">Herramientas que he usado para construir los proyectos de este portafolio.</p>

  <div class="skills-catalog">
    <section class="skill-group" *ngFor="let categoria of categorias">
      <h3 class="categoria-titulo">{{ categoria.titulo }}</h3>
      <ul class="skill-list">
        <li class="skill-row" *ngFor="let habilidad of categoria.habilidades">
          <span class="skill-monogram" aria-hidden="true">{{ habilidad.sigla }}</span>
          <span class="skill-name">{{ habilidad.nombre }}</span>
          <span class="skill-note">{{ habilidad.aplicacion }}</span>
        </li>
      </ul>
    </section>
  </div>
</section>
