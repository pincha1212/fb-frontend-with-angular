<section class="experiencia-container card-base">
  <h2>{{ extraData.tituloSeccion || 'Experiencia Complementaria & Formación' }}</h2>

  <div class="exp-grid">
    <div class="exp-cards">
      <div *ngFor="let exp of experienciasList" class="exp-card">
        <div class="exp-header">
          <h3 class="exp-puesto">{{ exp.rol }}</h3>
          <span class="exp-empresa">{{ exp.empresa }} · {{ exp.periodo }}</span>
        </div>
        <p class="exp-desc" style="color: #b6c6d7; font-size: 0.85rem; line-height: 1.6; margin-top: 0.6rem;">
          {{ exp.descripcion }}
        </p>
        <div class="tecnologias" style="display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.6rem;" *ngIf="exp.tecnologias?.length">
          <span *ngFor="let t of exp.tecnologias" style="padding: 0.2rem 0.45rem; background: rgba(116, 217, 235, 0.1); border: 1px solid rgba(116, 217, 235, 0.25); border-radius: 3px; color: #a6eff8; font-size: 0.65rem; font-family: monospace;">{{ t }}</span>
        </div>
      </div>
    </div>

    <div class="objetivo-box">
      <h3>Objetivo profesional</h3>
      <p class="objetivo-text">{{ extraData.objetivoProfesional }}</p>
      
      <div class="idiomas-card" aria-label="Nivel de Idioma" *ngFor="let idioma of extraData.idiomas">
        <span class="idioma-code" aria-hidden="true">{{ idioma.codigo || 'EN' }}</span>
        <strong class="idioma-name">{{ idioma.nombre }}</strong>
        <span class="idioma-val">{{ idioma.nivel }}</span>
      </div>
    </div>
  </div>
</section>
