name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Angular Project
        run: npm run build

      - name: Prepare Deployment Artifacts
        run: |
          if [ -d "dist/fb-frontend-with-angular/browser" ]; then
            cp dist/fb-frontend-with-angular/browser/index.html dist/fb-frontend-with-angular/browser/404.html 2>/dev/null || true
            echo "DEPLOY_DIR=dist/fb-frontend-with-angular/browser" >> $GITHUB_ENV
          else
            cp dist/fb-frontend-with-angular/index.html dist/fb-frontend-with-angular/404.html 2>/dev/null || true
            echo "DEPLOY_DIR=dist/fb-frontend-with-angular" >> $GITHUB_ENV
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.DEPLOY_DIR }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
